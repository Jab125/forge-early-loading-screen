apply plugin: "fabric-loom"


base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = "https://maven.jab125.dev/"
    }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven {
        url = "https://maven.minecraftforge.net"
    }
}

sourceSets {
    main {
        java {
            srcDirs += ["src/main/core", "src/main/neoforge", "src/main/loader", "src/main/earlydisplay"]
        }
    }
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

ExternalModuleDependency dependency0;
ExternalModuleDependency dependency1;
dependencies {
    dependency0 = implementation include('net.bytebuddy:byte-buddy-agent:1.14.0')
    dependency1 = implementation include("net.minecraftforge:unsafe:0.9.2")
}

loom {
    mixin {
        useLegacyMixinAp = false
    }
    mods {
        m {
            sourceSet sourceSets.main
            dependency(dependency0, dependency1)
        }
        testmod {
            sourceSet sourceSets.testmod
        }
    }
    createRemapConfigurations(sourceSets.testmod)
    accessWidenerPath = file("src/main/resources/early-loading-screen.accesswidener")
}

loom {
    runs {
        testmodClient {
            client()
            name = "Testmod Client"
            source sourceSets.testmod
        }
        testmodServer {
            server()
            name = "Testmod Server"
            source sourceSets.testmod
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    testmodImplementation(sourceSets.main.output)
    // Fabric API. This is technically optional, but you probably want it anyway.
    modTestmodRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    include(project(path: ":minecraft:1.21"))
    include(project(path: ":compat:fancymenu3"))
}

testmodClasses.dependsOn classes

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}


java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("../LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}